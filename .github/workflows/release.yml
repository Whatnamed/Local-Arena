name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Panel/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build, test, and package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/package.ps1 -ReleaseVersion $version -OutputDirectory (Join-Path $PWD "artifacts")

      - name: Check that the build left the tree clean
        shell: pwsh
        run: |
          if ((git status --short --untracked-files=no).Length -ne 0) { git status --short; throw "Build modified tracked files" }

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Local Arena ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-Preview.') }}
          make_latest: ${{ contains(github.ref_name, '-Preview.') && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            artifacts/LocalArena-${{ github.ref_name }}-windows.zip
            artifacts/LocalArena-panel-${{ github.ref_name }}-windows.zip
            artifacts/LocalArena-plugin-${{ github.ref_name }}-windows.zip
            artifacts/SHA256SUMS.txt
